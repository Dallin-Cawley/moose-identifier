[project]
name = "pythonproject"
version = "0.1.0"
description = "Sort trail-camera photos into 10-minute events and find the moose, using TypeSafe's Jev model."
readme = "README.md"
authors = [
    { name = "timmy2654", email = "lettergrade39@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
    "python-hcl2>=8.2.0",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
moose-sort = "pythonproject:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
